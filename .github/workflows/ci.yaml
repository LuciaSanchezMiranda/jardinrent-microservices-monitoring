name: Java 17 verification
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify both microservices
        run: mvn -B -ntp clean verify
      - name: Validate automation syntax
        run: for script in scripts/*.sh load-testing/*.sh; do bash -n "$script"; done
