apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: herramientas
  namespace: jardinrent
  labels: {proyecto: jardinrent}
spec:
  namespaceSelector:
    matchNames: [jardinrent]
  selector:
    matchLabels: {app: herramientas, proyecto: jardinrent}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
