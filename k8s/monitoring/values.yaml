# Contraseña propia en el Secret creado por setup.sh; no se publica la clave real.
grafana:
  admin:
    existingSecret: jardinrent-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 32000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring
prometheus:
  service:
    type: NodePort
    nodePort: 32001
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    evaluationInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests: {cpu: 200m, memory: 384Mi}
      limits: {memory: 1536Mi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 192Mi}
prometheusOperator:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 384Mi}
