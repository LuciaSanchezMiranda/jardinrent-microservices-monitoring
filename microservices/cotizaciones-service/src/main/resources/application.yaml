server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: cotizaciones-service
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: cotizaciones-service
jardinrent:
  delay-ms: ${RESPONSE_DELAY_MS:0}
  herramientas-url: ${HERRAMIENTAS_URL:http://localhost:8081}
  timeout-ms: ${HERRAMIENTAS_TIMEOUT_MS:2000}
